[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "my-package"
version = "0.1.0"
description = "My Python package"
readme = "README.md"
requires-python = ">=3.9"

authors = [
    { name = "Your Name" }
]

[tool.setuptools.packages.find]
where = ["src"]
